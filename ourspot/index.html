<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7fc"><title>OurSpot</title><style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#fff7fb;color:#2a1724}.loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 10% 0,#ffd6e8,transparent 28%),linear-gradient(180deg,#fff7fb,#fff)}.box{max-width:420px}.logo{font-size:34px;font-weight:900;color:#8f2357;margin-bottom:10px}.spin{width:42px;height:42px;border:4px solid #f5cade;border-top-color:#d83f7d;border-radius:50%;margin:18px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#8f7c88}</style></head><body><div class="loading"><div class="box"><div class="logo">OurSpot</div><div>Loading your Jaipur experience…</div><div class="spin"></div><small id="status">Preparing mobile app</small></div></div><script>(async()=>{const status=document.getElementById('status');try{const base='https://raw.githubusercontent.com/madhulstartupflora1-eng/Madhul-Khandelal/main/ourspot/';const names=['chunk0.txt','chunk1.txt','chunk2.txt','chunk3.txt'];const parts=[];for(const n of names){status.textContent='Loading '+n.replace('.txt','')+'…';const r=await fetch(base+n,{cache:'no-store'});if(!r.ok)throw new Error('Missing '+n);parts.push((await r.text()).trim())}const b64=parts.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Your browser is too old. Please use current Chrome/Safari.');status.textContent='Opening OurSpot…';const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);let html=await new Response(stream).text();html=html.replace('</body>','<script src="'+base+'patch.js?v=3"><\/script></body>');document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="loading"><div class="box"><div class="logo">OurSpot</div><h2>Could not open the app</h2><p>'+String(e.message||e)+'</p><small>Please refresh or open in current Chrome/Safari.</small></div></div>'}})();</script></body></html>
